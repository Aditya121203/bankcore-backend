# ===============================
# Server Configuration
# ===============================
# Render injects PORT at runtime; falls back to 8080 for local dev.
server.port=${PORT:8080}

# ===============================
# Database Configuration
# ===============================
# All three are read from environment variables in production (set these
# in the Render dashboard). Defaults below are only used for local dev.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/banking_system_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===============================
# JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# CORS Configuration
# ===============================
# Comma-separated list of allowed origins (the deployed frontend URL).
# Defaults to the Vite dev server for local development.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===============================
# JWT Configuration
# ===============================
# Falls back to the old dev secret locally; MUST be set in production.
app.jwt.secret=${JWT_SECRET:mySuperSecretKeyForOnlineBankingApplicationJwt2026}